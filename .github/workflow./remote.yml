name: 🚀 Cloud Terminal CLI Engine

on:
  repository_dispatch:
    types: [terminal-input]

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Environment Initialization
        uses: actions/checkout@v4

      - name: ⚙️ System Profile & Analytics
        run: |
          echo "=================================================="
          echo "🖥️ CLOUD RUNNER SYSTEM INITIALIZED"
          uname -a
          lscpu | grep "Model name\|CPU(s):" || true
          echo "=================================================="

      - name: ⚡ RUN LOCAL COMMAND PAYLOAD
        run: |
          echo "Executing local CLI payload..."
          echo "--------------------------------------------------"
          ${{ github.event.client_payload.command }}
          echo "--------------------------------------------------"
          
